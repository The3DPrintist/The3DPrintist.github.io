<!DOCTYPE html>
<html>

<head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
<meta name="msapplication-TileColor" content="#da532c">
<meta name="theme-color" content="#ffffff">
<link href="../style.css" rel="stylesheet">
<link href="themes/prism.css" rel="stylesheet" />
<title>Zachary's Blog</title>
</head>

<body>

  <div class="margin">
    <h1>Blog</h1>
    <p>No schedule, no problem.</p>
    <a href=".." class="btn btn-outline-light" role="button">back to home page</a>
  </div>

  <div class="section">
    <form>
      <label for="log">Choose a post:</label>
      <select name="log" id="logselect" onchange="OnDropdownChanged()">
        <option value="1">Blog?</option>
      </select>
    </form>
  </div>

  <div id="logsection">
  </div>

  <br>

  <div class ="flexbox">
    <div class="flexsection" style="flex: 1; text-align: center;">
        <p>
          Want me to blog about something I've done? Feel free to message me on my social media.
        </p>

        <a href="#top">
          <button type="submit" class="butn">back to top</button>
        </a>
    </div>
  </div>

  <br>

    <script type="text/javascript">

    function getQueryVariable(variable){
      var query = window.location.search.substring(1);
      var vars = query.split("&");
      for (var i=0;i<vars.length;i++) {
        var pair = vars[i].split("=");
        if(pair[0] == variable){return pair[1];}
      }
      return(false);
    }

    function selectLog(name) {    
      let select = document.getElementById("logselect");
      select.value = name;

      //add option if its not valid
      if(select.value == ""){
        var opt = document.createElement('option');
        opt.value = name;
        opt.innerHTML = name;
        select.appendChild(opt);
        select.value = name;
      }

      changeLog()
    }

    function changeLog() {
      var select = document.getElementById("logselect");
      var section = document.getElementById("logsection");

      fetch("logs/" + select.value + ".html")
        .then(response => response.text())
        .then((data) => {
        section.innerHTML = data;
        reHightlight();
      })

    }

    function OnDropdownChanged(){
      var select = document.getElementById("logselect");
      const newParams = new URLSearchParams({ log: select.value});
      window.history.pushState({}, "", "?" + newParams.toString());

      changeLog();
    }

    function reHightlight(){
      Prism.highlightAll();
    }
    
    //load from url query
    let urllog = getQueryVariable("log")
    if(urllog){
      console.log("loading param from url")

      selectLog(urllog)
    }else{
      var select = document.getElementById("logselect");
      select.selectedIndex = select.options.length - 1;
      changeLog();

    }

  </script>

</body>
</html>
